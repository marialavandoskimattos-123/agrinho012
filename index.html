<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Sustentável - Oficial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Agro<span>Forte</span></div>
            <button id="theme-toggle" class="btn-nav">🌓 Modo Escuro</button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="glass-box">
                <h1 id="main-title">O Equilíbrio é o Futuro</h1>
                <p>Produção e Meio Ambiente em harmonia.</p>
                
                <div class="interacao">
                    <input type="text" id="user-input" placeholder="Digite seu nome">
                    <button id="btn-action">Ver Resultado</button>
                </div>
                <div id="feedback-area"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
